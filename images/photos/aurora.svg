<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="asky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a1e"/>
      <stop offset="100%" stop-color="#0c1631"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.0"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="aur3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.0"/>
      <stop offset="55%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#asky)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="180" cy="100" r="1.1" opacity="0.6"/>
    <circle cx="290" cy="50" r="1.4" opacity="0.8"/>
    <circle cx="410" cy="90" r="1.2" opacity="0.7"/>
    <circle cx="530" cy="45" r="1.7" opacity="0.9"/>
    <circle cx="650" cy="95" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="55" r="1.5" opacity="0.8"/>
    <circle cx="120" cy="170" r="1.2" opacity="0.5"/>
    <circle cx="360" cy="180" r="1.1" opacity="0.5"/>
    <circle cx="600" cy="160" r="1.3" opacity="0.7"/>
    <circle cx="720" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="40" cy="250" r="1.2" opacity="0.5"/>
  </g>
  <!-- aurora ribbons -->
  <path d="M-50,120 Q150,300 120,560 L220,560 Q260,280 60,80 Z" fill="url(#aur1)"/>
  <path d="M180,60 Q360,260 330,560 L420,560 Q470,240 260,40 Z" fill="url(#aur2)"/>
  <path d="M420,90 Q560,280 540,560 L620,560 Q660,250 500,60 Z" fill="url(#aur3)"/>
  <path d="M620,140 Q720,300 700,560 L770,560 Q800,280 690,110 Z" fill="url(#aur1)" opacity="0.6"/>
  <!-- ground -->
  <path d="M0,540 Q200,520 400,538 T800,532 L800,600 L0,600 Z" fill="#0a1128"/>
  <path d="M0,565 Q250,550 500,562 T800,558 L800,600 L0,600 Z" fill="#060b1d"/>
  <!-- pines -->
  <g fill="#03060f">
    <polygon points="90,540 70,540 80,470"/>
    <polygon points="130,542 105,542 118,455"/>
    <polygon points="660,545 635,545 648,460"/>
    <polygon points="710,548 690,548 700,480"/>
    <polygon points="760,542 738,542 750,462"/>
  </g>
</svg>
