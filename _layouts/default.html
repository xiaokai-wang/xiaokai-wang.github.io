<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="author" content="{{ site.author }}" />
  <meta name="description" content="{{ site.description }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/style.css" type="text/css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) { t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* noop */ }
    })();
  </script>
</head>
<body>

  <header class="site-nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/">
        <span class="logo-mark">XK</span>
        <span class="logo-text">xiaokai.wang</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="/" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}>首页</a>
        <a href="/life/" {% if page.category == 'life' or page.url == '/life/' %}class="active"{% endif %}>生活</a>
        <a href="/photos/" {% if page.category == 'photos' or page.url == '/photos/' %}class="active"{% endif %}>照片</a>
        <a href="/opinion/" {% if page.category == 'opinion' or page.url == '/opinion/' %}class="active"{% endif %}>观点</a>
        <a href="/tech/" {% if page.category == 'tech' or page.url == '/tech/' %}class="active"{% endif %}>技术</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换亮/暗主题" title="切换亮/暗主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2016&ndash;2026 {{ site.author }}</p>
      <p>Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> &middot; Hosted on GitHub</p>
    </div>
  </footer>

  <script src="/js/main.js?v=2" defer></script>
</body>
</html>
