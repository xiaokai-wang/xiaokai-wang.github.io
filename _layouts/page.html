---
layout:           default
---
<div class="container">
  <article class="article">
    <header class="article-head anim">
      {% if page.category %}<div class="article-meta"><a class="badge c-{{ page.category }}" href="/{{ page.category }}/">{% include cat-label.html cat=page.category %}</a></div>{% endif %}
      <h1>{{ page.title }}</h1>
    </header>
    <div class="prose anim d1">
      {{ content }}
    </div>
  </article>
</div>
